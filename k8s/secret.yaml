apiVersion: v1
kind: Secret
metadata:
  name: balance-service-secrets
  namespace: default # 可自定义命名空间
type: Opaque
data:
  # 注意：以下值需要用base64编码（echo -n "你的值" | base64）
  rds-username: cG9zdGdyZXM= # 示例：postgres（base64编码）
  rds-password: cG9zdGdyZXNwYXNzd29yZA== # 示例：postgrespassword（base64编码）
  redis-password: "" # 若Redis无密码，留空（base64编码后为空字符串）